<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT STEAM LAB | v5.0 — Космический контроль аккаунтов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }
        
        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0e1a, #03050b);
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* Звёздный фон */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }
        
        /* Орбитальные кольца */
        .orbit-ring {
            position: fixed;
            border: 1px solid rgba(0, 200, 255, 0.08);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Главная панель — стеклянная платформа */
        .glass-orbit {
            background: rgba(8, 12, 20, 0.65);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 220, 255, 0.25);
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        /* Карточка аккаунта — нео-морфизм + свечение */
        .neo-card {
            background: linear-gradient(145deg, rgba(16, 22, 35, 0.9), rgba(8, 12, 22, 0.95));
            border-radius: 1.8rem;
            border: 1px solid rgba(0, 200, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .neo-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.08) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .neo-card:hover::after {
            opacity: 1;
        }
        
        .neo-card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: rgba(0, 220, 255, 0.6);
            box-shadow: 0 20px 35px -12px rgba(0, 180, 255, 0.4);
        }
        
        /* Голографический аватар */
        .hologram {
            background: linear-gradient(135deg, #1a2a3a, #0f1822);
            border-radius: 1.2rem;
            position: relative;
            overflow: hidden;
        }
        
        .hologram::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(0, 200, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        
        .neo-card:hover .hologram::before {
            transform: translateX(100%);
        }
        
        /* Статус с анимированной пульсацией */
        .status-neon {
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }
        
        .status-online-neon {
            background: rgba(0, 255, 150, 0.15);
            color: #0f0;
            border: 1px solid #0f0;
            box-shadow: 0 0 8px #0f0;
            animation: neonPulse 1.5s infinite;
        }
        
        @keyframes neonPulse {
            0%, 100% { box-shadow: 0 0 5px #0f0; }
            50% { box-shadow: 0 0 15px #0f0; }
        }
        
        /* Кнопки с эффектом частиц */
        .glow-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            border-radius: 1.2rem;
            font-weight: 600;
        }
        
        .glow-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .glow-btn:hover::before {
            left: 100%;
        }
        
        /* Прогресс-бар для статистики */
        .stat-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .stat-fill {
            height: 100%;
            background: linear-gradient(90deg, #00b4ff, #00ff88);
            border-radius: 10px;
            width: 0%;
            transition: width 1s ease;
        }
        
        /* Модальное окно — футуристическое */
        .modal-future {
            background: rgba(6, 10, 18, 0.98);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(0, 200, 255, 0.3);
            border-radius: 2rem;
            animation: floatIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes floatIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        /* Стилизация скролла */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #00b4ff;
            border-radius: 10px;
        }
        
        /* Анимация для уведомлений */
        .toast-cosmic {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            padding: 0.8rem 2rem;
            border-radius: 3rem;
            color: #0ff;
            font-weight: 500;
            border: 1px solid #0ff;
            z-index: 1000;
            animation: slideUpFade 0.3s ease;
            white-space: nowrap;
        }
        
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        /* Космический свитчер */
        .toggle-switch {
            width: 50px;
            height: 26px;
            background: #1e293b;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .toggle-switch.active {
            background: #00b4ff;
        }
        
        .toggle-knob {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: 0.3s;
        }
        
        .toggle-switch.active .toggle-knob {
            left: 25px;
        }
        
        input, textarea, select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 200, 255, 0.3);
            border-radius: 1rem;
            padding: 0.7rem 1rem;
            color: white;
            transition: 0.2s;
        }
        
        input:focus, textarea:focus, select:focus {
            border-color: #0ff;
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 255, 255, 0.2);
        }
        
        .badge-crypto {
            background: linear-gradient(135deg, #00b4ff20, #00ff8820);
            border-radius: 2rem;
            padding: 0.2rem 0.7rem;
            font-size: 0.7rem;
            color: #0ff;
        }
    </style>
</head>
<body>

<!-- Звёздное поле -->
<div class="stars" id="starsContainer"></div>

<!-- Орбитальные кольца -->
<div class="orbit-ring" style="width: 500px; height: 500px; right: -200px; top: -200px; border-width: 2px; animation: rotate 60s linear infinite;"></div>
<div class="orbit-ring" style="width: 800px; height: 800px; left: -300px; bottom: -300px; border-width: 1px; animation: rotate 90s linear infinite reverse;"></div>

<div class="relative z-10 flex h-screen p-5 gap-5">
    <!-- ЛЕВАЯ ПАНЕЛЬ — КОСМИЧЕСКАЯ КОНСОЛЬ -->
    <div class="w-80 glass-orbit p-5 flex flex-col backdrop-blur-2xl">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-2xl relative">
                <i class="fas fa-satellite-dish text-white text-xl"></i>
                <div class="absolute -top-1 -right-1 w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-cyan-300 to-emerald-300 bg-clip-text text-transparent">ORBIT LAB</h1>
                <p class="text-[10px] text-cyan-400/70 tracking-widest">STEAM ORBIT v5.0</p>
            </div>
        </div>
        
        <button onclick="createNewAccount()" class="glow-btn w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all bg-gradient-to-r from-cyan-600 to-blue-600 hover:shadow-cyan-500/50 text-white mb-3">
            <i class="fas fa-plus-circle"></i> Новая орбита
        </button>
        
        <button onclick="launchAll()" class="glow-btn w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:shadow-emerald-500/50 text-white mb-6">
            <i class="fas fa-rocket"></i> Запуск флота
        </button>
        
        <div class="space-y-2">
            <button onclick="changeGalaxy('accounts')" id="navAccounts" class="w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 text-gray-300 hover:bg-cyan-900/30 transition-all group">
                <i class="fas fa-users text-cyan-400 w-5"></i> Аккаунты
                <span class="ml-auto text-xs opacity-0 group-hover:opacity-100 transition">▶</span>
            </button>
            <button onclick="changeGalaxy('inventory')" id="navInventory" class="w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 text-gray-300 hover:bg-cyan-900/30 transition-all group">
                <i class="fas fa-cubes text-purple-400 w-5"></i> Инвентарь
                <span class="ml-auto text-xs opacity-0 group-hover:opacity-100 transition">▶</span>
            </button>
            <button onclick="changeGalaxy('stats')" id="navStats" class="w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 text-gray-300 hover:bg-cyan-900/30 transition-all group">
                <i class="fas fa-chart-line text-green-400 w-5"></i> Космостаты
                <span class="ml-auto text-xs opacity-0 group-hover:opacity-100 transition">▶</span>
            </button>
            <button onclick="changeGalaxy('settings')" id="navSettings" class="w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 text-gray-300 hover:bg-cyan-900/30 transition-all group">
                <i class="fas fa-microchip text-yellow-400 w-5"></i> Система
                <span class="ml-auto text-xs opacity-0 group-hover:opacity-100 transition">▶</span>
            </button>
        </div>
        
        <!-- Статусная панель -->
        <div class="mt-auto pt-6 text-xs border-t border-cyan-500/20">
            <div class="flex justify-between items-center">
                <span class="text-gray-500"><i class="fas fa-database mr-1"></i> Нейросеть</span>
                <span class="text-cyan-400" id="totalCountSpan">0 юнитов</span>
            </div>
            <div class="stat-bar mt-2">
                <div class="stat-fill" id="globalFill" style="width: 0%"></div>
            </div>
        </div>
    </div>
    
    <!-- ЦЕНТРАЛЬНЫЙ КОСМОДРОМ (КОНТЕНТ) -->
    <div class="flex-1 glass-orbit overflow-auto p-5 relative" id="contentArea">
        <div id="dynamicContent" class="animate-pulse text-center text-gray-500 mt-20">Загрузка орбитальных данных...</div>
    </div>
</div>

<!-- Модалки будущего -->
<div id="modalDetail" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl flex items-center justify-center z-50 p-4">
    <div class="modal-future w-[800px] max-h-[85vh] overflow-auto p-6">
        <div class="flex justify-between items-center border-b border-cyan-500/30 pb-3">
            <h2 id="modalDetailTitle" class="text-2xl font-bold text-cyan-300"></h2>
            <button onclick="closeModal('modalDetail')" class="text-gray-400 hover:text-white text-3xl">&times;</button>
        </div>
        <div id="modalDetailBody" class="my-5"></div>
        <div class="flex gap-3 flex-wrap">
            <button onclick="actionEditFromDetail()" class="flex-1 py-2 bg-cyan-600 rounded-xl"><i class="fas fa-edit"></i> Редакт</button>
            <button onclick="actionRunASFDetail()" class="flex-1 py-2 bg-emerald-600 rounded-xl"><i class="fas fa-play"></i> ASF</button>
            <button onclick="actionRunSteamDetail()" class="flex-1 py-2 bg-blue-800 rounded-xl"><i class="fab fa-steam"></i> Steam</button>
            <button onclick="actionDeleteFromDetail()" class="flex-1 py-2 bg-red-600 rounded-xl">Уничтожить</button>
            <button onclick="closeModal('modalDetail')" class="flex-1 py-2 bg-gray-700 rounded-xl">Закрыть</button>
        </div>
    </div>
</div>

<div id="modalEdit" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl flex items-center justify-center z-50 p-4">
    <div class="modal-future w-[700px] max-h-[85vh] overflow-auto p-6">
        <h2 class="text-2xl font-bold text-cyan-300 mb-4">Настройки профиля</h2>
        <div class="grid grid-cols-2 gap-3">
            <input id="editLogin" placeholder="Логин" class="w-full">
            <input id="editPass" type="password" placeholder="Пароль" class="w-full">
            <input id="editSteamId" placeholder="Steam ID" class="w-full">
            <input id="editBalance" placeholder="Баланс" class="w-full">
            <input id="editEmail" placeholder="Email" class="w-full">
            <input id="editProxy" placeholder="Proxy (ip:port)" class="w-full">
            <textarea id="editNotes" rows="2" placeholder="Заметки" class="col-span-2 w-full"></textarea>
            <textarea id="editMaFile" rows="2" placeholder="MaFile JSON" class="col-span-2 w-full font-mono text-xs"></textarea>
        </div>
        <div class="flex gap-3 mt-5">
            <button onclick="saveAccountEdit()" class="flex-1 py-2 bg-cyan-600 rounded-xl">Сохранить</button>
            <button onclick="closeModal('modalEdit')" class="flex-1 py-2 bg-gray-700 rounded-xl">Отмена</button>
        </div>
    </div>
</div>

<div id="modalSpoof" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl flex items-center justify-center z-50 p-4">
    <div class="modal-future w-[450px] p-6">
        <h2 class="text-xl font-bold text-purple-300 mb-3">Спуфер · <span id="spoofAccName"></span></h2>
        <input id="hwidValue" placeholder="HWID" class="w-full mb-3">
        <button onclick="genNewHwid()" class="text-sm bg-purple-700 px-3 py-1 rounded-xl mb-3">🌀 Генератор HWID</button>
        <div class="flex items-center gap-3 mb-3">
            <div id="toggleIsolation" class="toggle-switch" onclick="toggleIsolationFlag()"></div>
            <span class="text-sm text-gray-300">Изоляция аккаунта</span>
        </div>
        <select id="launchSelect" class="w-full mb-4">
            <option value="normal">Обычный запуск</option>
            <option value="bigpicture">Big Picture</option>
            <option value="vr">VR режим</option>
        </select>
        <div class="flex gap-3">
            <button onclick="saveSpoof()" class="flex-1 bg-purple-600 py-2 rounded-xl">Применить</button>
            <button onclick="closeModal('modalSpoof')" class="flex-1 bg-gray-700 py-2 rounded-xl">Отмена</button>
        </div>
    </div>
</div>

<script>
    // ========== КОСМИЧЕСКАЯ БАЗА ДАННЫХ ==========
    let accounts = [];
    let currentGalaxy = 'accounts';
    let currentEditId = null;
    let currentDetailAccount = null;
    let selectedMass = new Set();
    let currentSpoofId = null;
    let filterText = '';
    
    // Инициализация звёзд
    function createStars() {
        const container = document.getElementById('starsContainer');
        for(let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = 2 + Math.random() * 4 + 's';
            container.appendChild(star);
        }
    }
    
    // Переключение галактик
    function changeGalaxy(galaxy) {
        currentGalaxy = galaxy;
        ['Accounts','Inventory','Stats','Settings'].forEach(g => {
            const btn = document.getElementById(`nav${g}`);
            if(btn) btn.classList.remove('bg-cyan-900/30', 'text-white');
        });
        const activeBtn = document.getElementById(`nav${galaxy.charAt(0).toUpperCase() + galaxy.slice(1)}`);
        if(activeBtn) activeBtn.classList.add('bg-cyan-900/30', 'text-white');
        
        if(galaxy === 'accounts') renderOrbitAccounts();
        else if(galaxy === 'inventory') renderInventoryGalaxy();
        else if(galaxy === 'stats') renderStatsGalaxy();
        else renderSettingsGalaxy();
    }
    
    // ========== ГАЛАКТИКА АККАУНТОВ ==========
    function renderOrbitAccounts() {
        let filtered = accounts.filter(a => !filterText || a.Login.toLowerCase().includes(filterText) || (a.Email||'').toLowerCase().includes(filterText));
        let html = `
            <div class="mb-5 flex gap-3 flex-wrap">
                <div class="flex-1 relative">
                    <i class="fas fa-search absolute left-4 top-3 text-gray-500"></i>
                    <input type="text" id="searchOrbit" onkeyup="updateFilter()" placeholder="Поиск по вселенной..." class="w-full pl-11 py-2 rounded-xl bg-black/40 border border-cyan-500/30">
                </div>
                <button onclick="openMassField()" class="px-4 py-2 bg-cyan-800/50 rounded-xl text-sm"><i class="fas fa-layer-group"></i> Масс-эффект <span id="massCount" class="text-cyan-300">0</span></button>
                <button onclick="exportOrbit()" class="px-4 py-2 bg-emerald-800/50 rounded-xl text-sm"><i class="fas fa-download"></i> Экспорт</button>
                <button onclick="importOrbit()" class="px-4 py-2 bg-blue-800/50 rounded-xl text-sm"><i class="fas fa-upload"></i> Импорт</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-5">
        `;
        
        filtered.forEach(acc => {
            const isSelected = selectedMass.has(acc.Id);
            const avatarColor = `linear-gradient(135deg, #${Math.floor(Math.random()*16777215).toString(16)}, #${Math.floor(Math.random()*16777215).toString(16)})`;
            html += `
                <div class="neo-card p-4 relative" onclick="showAccountGalaxy('${acc.Id}')">
                    <input type="checkbox" class="absolute top-4 left-4 w-4 h-4 accent-cyan-500 z-20" onclick="event.stopPropagation(); toggleMassSelect('${acc.Id}')" ${isSelected ? 'checked' : ''}>
                    <div class="flex justify-between items-start ml-7">
                        <div class="flex gap-3">
                            <div class="hologram w-12 h-12 flex items-center justify-center text-xl font-black text-white" style="background:${avatarColor}">${acc.Login[0]?.toUpperCase()}</div>
                            <div><div class="font-bold text-white text-lg">${acc.Login}</div><div class="text-xs text-gray-400">${acc.Email || 'без почты'}</div></div>
                        </div>
                        <div class="status-neon ${acc.Status === 'Online' ? 'status-online-neon' : 'bg-gray-800 text-gray-400'}">${acc.Status === 'Online' ? '🟢 ONLINE' : '⚫ OFFLINE'}</div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-4 text-xs">
                        <div class="bg-black/30 p-2 rounded-xl flex justify-between"><span class="text-gray-400">🛡️ Прокси</span><span>${acc.Proxy ? '✅' : '❌'}</span></div>
                        <div class="bg-black/30 p-2 rounded-xl flex justify-between"><span class="text-gray-400">🔐 2FA</span><span>${acc.MaFile ? '✅' : '❌'}</span></div>
                        <div class="bg-black/30 p-2 rounded-xl flex justify-between col-span-2"><span class="text-gray-400">💰 Кредиты</span><span class="text-emerald-400 font-bold">${acc.Balance}</span></div>
                    </div>
                    <div class="flex gap-2 mt-4" onclick="event.stopPropagation()">
                        <button onclick="runAsfQuick('${acc.Login}')" class="flex-1 py-1.5 bg-emerald-700 rounded-xl text-xs"><i class="fas fa-play"></i> ASF</button>
                        <button onclick="runSteamQuick('${acc.Login}', '${escapeHtml(acc.Password)}')" class="flex-1 py-1.5 bg-blue-800 rounded-xl text-xs"><i class="fab fa-steam"></i> Steam</button>
                        <button onclick="openSpoofPanel('${acc.Id}')" class="px-3 py-1.5 bg-purple-800 rounded-xl text-xs"><i class="fas fa-magic"></i></button>
                        <button onclick="editAccountCard('${acc.Id}')" class="px-3 py-1.5 bg-amber-700 rounded-xl text-xs"><i class="fas fa-pen"></i></button>
                        <button onclick="deleteAccountCard('${acc.Id}')" class="px-3 py-1.5 bg-red-800 rounded-xl text-xs"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
        
        if(filtered.length === 0) html += `<div class="col-span-full text-center py-20 text-gray-500"><i class="fas fa-meteor text-5xl mb-3"></i><p>Пустота... Добавьте аккаунт</p></div>`;
        html += `</div>`;
        document.getElementById('dynamicContent').innerHTML = html;
        document.getElementById('totalCountSpan').innerHTML = accounts.length + ' юнитов';
        document.getElementById('massCount').innerHTML = selectedMass.size;
        const percent = accounts.length ? (accounts.filter(a=>a.Status==='Online').length / accounts.length * 100) : 0;
        document.getElementById('globalFill').style.width = percent + '%';
    }
    
    function updateFilter() { filterText = document.getElementById('searchOrbit')?.value.toLowerCase() || ''; renderOrbitAccounts(); }
    function toggleMassSelect(id) { if(selectedMass.has(id)) selectedMass.delete(id); else selectedMass.add(id); renderOrbitAccounts(); }
    function openMassField() { 
        if(selectedMass.size === 0) { showToast('Выберите аккаунты'); return; }
        let val = prompt('Массовое изменение: введите новые заметки');
        if(val !== null) {
            selectedMass.forEach(id => { let acc = accounts.find(a=>a.Id===id); if(acc) acc.Notes = val; });
            saveToHost();
            renderOrbitAccounts();
            showToast(`Обновлено ${selectedMass.size} аккаунтов`);
            selectedMass.clear();
        }
    }
    
    function createNewAccount() {
        currentEditId = null;
        document.getElementById('editLogin').value = `orb_${Math.floor(Math.random()*10000)}`;
        document.getElementById('editPass').value = '';
        document.getElementById('editSteamId').value = '';
        document.getElementById('editBalance').value = '0 ₽';
        document.getElementById('editEmail').value = '';
        document.getElementById('editProxy').value = '';
        document.getElementById('editNotes').value = '';
        document.getElementById('editMaFile').value = '';
        document.getElementById('modalEdit').classList.remove('hidden');
    }
    
    function editAccountCard(id) {
        let acc = accounts.find(a=>a.Id===id);
        if(!acc) return;
        currentEditId = id;
        document.getElementById('editLogin').value = acc.Login;
        document.getElementById('editPass').value = acc.Password || '';
        document.getElementById('editSteamId').value = acc.SteamId || '';
        document.getElementById('editBalance').value = acc.Balance;
        document.getElementById('editEmail').value = acc.Email || '';
        document.getElementById('editProxy').value = acc.Proxy || '';
        document.getElementById('editNotes').value = acc.Notes || '';
        document.getElementById('editMaFile').value = acc.MaFile || '';
        document.getElementById('modalEdit').classList.remove('hidden');
    }
    
    function saveAccountEdit() {
        let data = {
            Id: currentEditId || Date.now().toString(),
            Login: document.getElementById('editLogin').value.trim(),
            Password: document.getElementById('editPass').value,
            SteamId: document.getElementById('editSteamId').value,
            Email: document.getElementById('editEmail').value,
            Proxy: document.getElementById('editProxy').value,
            Notes: document.getElementById('editNotes').value,
            MaFile: document.getElementById('editMaFile').value,
            Balance: document.getElementById('editBalance').value || '0 ₽',
            Status: currentEditId ? (accounts.find(a=>a.Id===currentEditId)?.Status || 'Offline') : 'Offline',
            CreatedAt: currentEditId ? (accounts.find(a=>a.Id===currentEditId)?.CreatedAt || new Date().toISOString()) : new Date().toISOString(),
            HardwareId: currentEditId ? (accounts.find(a=>a.Id===currentEditId)?.HardwareId || '') : '',
            UseIsolation: currentEditId ? (accounts.find(a=>a.Id===currentEditId)?.UseIsolation || false) : false,
            LaunchMode: currentEditId ? (accounts.find(a=>a.Id===currentEditId)?.LaunchMode || 'normal') : 'normal'
        };
        if(!data.Login) { showToast('Логин обязателен'); return; }
        if(currentEditId) {
            let idx = accounts.findIndex(a=>a.Id===currentEditId);
            if(idx !== -1) accounts[idx] = data;
        } else accounts.unshift(data);
        saveToHost();
        closeModal('modalEdit');
        renderOrbitAccounts();
        showToast('Аккаунт сохранён');
    }
    
    function deleteAccountCard(id) { if(confirm('Уничтожить аккаунт?')) { accounts = accounts.filter(a=>a.Id!==id); selectedMass.delete(id); saveToHost(); renderOrbitAccounts(); showToast('Аккаунт уничтожен'); } }
    function runAsfQuick(login) { showToast(`ASF запущен для ${login}`); if(window.chrome?.webview) window.chrome.webview.postMessage(JSON.stringify({ action: "runASF", data: login })); }
    function runSteamQuick(login, pass) { if(!pass) { showToast('Нет пароля'); return; } showToast(`Steam: ${login}`); if(window.chrome?.webview) window.chrome.webview.postMessage(JSON.stringify({ action: "runSteam", data: `${login}|${pass}` })); }
    function launchAll() { if(!accounts.length) return; showToast(`Запуск флота (${accounts.length} кораблей)`); if(window.chrome?.webview) window.chrome.webview.postMessage(JSON.stringify({ action: "runASFForAll", data: "" })); }
    
    function showAccountGalaxy(id) {
        let acc = accounts.find(a=>a.Id===id);
        if(!acc) return;
        currentDetailAccount = acc;
        let html = `
            <div class="space-y-3">
                <div class="flex justify-between border-b border-cyan-500/30 pb-2"><span class="text-gray-400">Логин:</span><span class="text-white">${acc.Login}</span><button class="text-xs text-cyan-400" onclick="copyText('${acc.Login}')">Копировать</button></div>
                <div class="flex justify-between"><span class="text-gray-400">Steam ID:</span><span>${acc.SteamId || '—'}</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Баланс:</span><span class="text-emerald-400">${acc.Balance}</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Прокси:</span><span>${acc.Proxy || 'Нет'}</span></div>
                <div class="flex justify-between"><span class="text-gray-400">HWID:</span><span class="font-mono text-xs">${acc.HardwareId || '—'}</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Изоляция:</span><span>${acc.UseIsolation ? 'Да' : 'Нет'}</span></div>
                <div>📝 Заметки: ${acc.Notes || '—'}</div>
            </div>
        `;
        document.getElementById('modalDetailTitle').innerHTML = `<i class="fab fa-steam"></i> ${acc.Login}`;
        document.getElementById('modalDetailBody').innerHTML = html;
        document.getElementById('modalDetail').classList.remove('hidden');
    }
    
    function actionRunASFDetail() { if(currentDetailAccount) runAsfQuick(currentDetailAccount.Login); closeModal('modalDetail'); }
    function actionRunSteamDetail() { if(currentDetailAccount) runSteamQuick(currentDetailAccount.Login, currentDetailAccount.Password); closeModal('modalDetail'); }
    function actionEditFromDetail() { if(currentDetailAccount) { closeModal('modalDetail'); editAccountCard(currentDetailAccount.Id); } }
    function actionDeleteFromDetail() { if(currentDetailAccount && confirm('Удалить?')) { deleteAccountCard(currentDetailAccount.Id); closeModal('modalDetail'); } }
    
    // ========== ИНВЕНТАРЬ ==========
    function renderInventoryGalaxy() {
        document.getElementById('dynamicContent').innerHTML = `
            <div class="max-w-4xl mx-auto text-center">
                <div class="glass-orbit p-6 mb-5">
                    <h2 class="text-3xl font-bold text-cyan-300 mb-4"><i class="fas fa-cube"></i> Сканер инвентаря</h2>
                    <div class="flex gap-3">
                        <input id="invSteamId" placeholder="Steam ID или логин" class="flex-1">
                        <select id="invApp" class="w-48">
                            <option value="730">CS2</option><option value="570">Dota 2</option><option value="252490">Rust</option><option value="271590">GTA V</option>
                        </select>
                        <button onclick="scanInventory()" class="bg-purple-600 px-6 rounded-xl">Сканировать</button>
                    </div>
                </div>
                <div id="inventoryResultArea" class="glass-orbit p-6 min-h-[300px] flex items-center justify-center text-gray-500"><i class="fas fa-radar text-4xl mb-3 block"></i><p>Введите ID для сканирования</p></div>
            </div>
        `;
    }
    
    function scanInventory() {
        let sid = document.getElementById('invSteamId').value;
        if(!sid) { showToast('Нужен Steam ID'); return; }
        document.getElementById('inventoryResultArea').innerHTML = '<div class="text-center"><i class="fas fa-spinner fa-spin text-3xl"></i><p>Сканирование...</p></div>';
        setTimeout(() => {
            document.getElementById('inventoryResultArea').innerHTML = '<div class="text-center text-emerald-400"><i class="fas fa-check-circle text-4xl"></i><p>Демо-режим: 24 предмета найдено (симуляция)</p><div class="grid grid-cols-4 gap-2 mt-4">' + Array(12).fill(0).map(() => `<div class="bg-black/30 p-2 rounded-xl"><i class="fab fa-steam text-2xl"></i><div class="text-xs">Предмет</div></div>`).join('') + '</div></div>';
        }, 1000);
    }
    
    // ========== СТАТИСТИКА ==========
    function renderStatsGalaxy() {
        let online = accounts.filter(a=>a.Status==='Online').length;
        let totalBal = accounts.reduce((s,a)=> s + (parseFloat(a.Balance)||0),0);
        let proxyCount = accounts.filter(a=>a.Proxy).length;
        let mafileCount = accounts.filter(a=>a.MaFile).length;
        document.getElementById('dynamicContent').innerHTML = `
            <div class="space-y-5">
                <h2 class="text-3xl font-bold text-gradient">Космическая аналитика</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="glass-orbit p-5 text-center"><i class="fas fa-ship text-cyan-400 text-2xl"></i><div class="text-3xl font-bold text-white">${accounts.length}</div><div>Всего</div></div>
                    <div class="glass-orbit p-5 text-center"><i class="fas fa-broadcast-tower text-green-400 text-2xl"></i><div class="text-3xl font-bold text-green-400">${online}</div><div>Активные</div></div>
                    <div class="glass-orbit p-5 text-center"><i class="fas fa-coins text-yellow-400 text-2xl"></i><div class="text-2xl font-bold text-yellow-300">${totalBal.toFixed(2)} ₽</div><div>Баланс</div></div>
                    <div class="glass-orbit p-5 text-center"><i class="fas fa-shield text-purple-400 text-2xl"></i><div class="text-xl font-bold">${proxyCount} прокси</div><div>${mafileCount} 2FA</div></div>
                </div>
            </div>
        `;
    }
    
    function renderSettingsGalaxy() {
        document.getElementById('dynamicContent').innerHTML = `
            <div class="glass-orbit p-6 max-w-2xl mx-auto">
                <h2 class="text-2xl font-bold text-cyan-300 mb-4"><i class="fas fa-microchip"></i> Системные настройки</h2>
                <div class="space-y-4">
                    <div class="flex justify-between items-center"><span>Путь к Steam.exe</span><div class="flex gap-2"><input id="steamPath" class="w-96"><button onclick="saveSteamPathLocal()" class="bg-cyan-700 px-3 py-1 rounded-xl">Сохранить</button></div></div>
                    <button onclick="deleteAllData()" class="w-full bg-red-800 py-2 rounded-xl mt-4">⚠️ СБРОС ВСЕХ ДАННЫХ</button>
                </div>
            </div>
        `;
        if(window.chrome?.webview) window.chrome.webview.postMessage(JSON.stringify({ action: "getSteamPath", data: "" }));
    }
    
    function deleteAllData() { if(confirm('Уничтожить все аккаунты?')) { accounts = []; selectedMass.clear(); saveToHost(); changeGalaxy('accounts'); showToast('Все данные стерты'); } }
    
    // ========== СПУФЕР ==========
    function openSpoofPanel(id) {
        let acc = accounts.find(a=>a.Id===id);
        if(!acc) return;
        currentSpoofId = id;
        document.getElementById('spoofAccName').innerText = acc.Login;
        document.getElementById('hwidValue').value = acc.HardwareId || '';
        document.getElementById('launchSelect').value = acc.LaunchMode || 'normal';
        const toggleDiv = document.getElementById('toggleIsolation');
        if(acc.UseIsolation) toggleDiv.classList.add('active'); else toggleDiv.classList.remove('active');
        document.getElementById('modalSpoof').classList.remove('hidden');
    }
    
    function toggleIsolationFlag() {
        document.getElementById('toggleIsolation').classList.toggle('active');
    }
    
    function genNewHwid() { document.getElementById('hwidValue').value = `HWID-${Math.random().toString(36).substring(2,10).toUpperCase()}-${Date.now().toString().slice(-6)}`; }
    
    function saveSpoof() {
        if(currentSpoofId) {
            let acc = accounts.find(a=>a.Id===currentSpoofId);
            if(acc) {
                acc.HardwareId = document.getElementById('hwidValue').value;
                acc.UseIsolation = document.getElementById('toggleIsolation').classList.contains('active');
                acc.LaunchMode = document.getElementById('launchSelect').value;
                saveToHost();
                renderOrbitAccounts();
                showToast('Спуфер настроен');
            }
        }
        closeModal('modalSpoof');
    }
    
    // ========== УТИЛИТЫ ==========
    function saveToHost() { if(window.chrome?.webview) window.chrome.webview.postMessage(JSON.stringify({ action: "saveAccounts", data: JSON.stringify(accounts) })); else localStorage.setItem('orbit_accounts', JSON.stringify(accounts)); }
    function exportOrbit() { const blob = new Blob([JSON.stringify(accounts)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `orbit_backup_${Date.now()}.json`; a.click(); showToast('Экспорт готов'); }
    function importOrbit() { const inp = document.createElement('input'); inp.type='file'; inp.accept='.json'; inp.onchange=e=>{ const file=e.target.files[0]; const reader=new FileReader(); reader.onload=ev=>{ try{ const imported=JSON.parse(ev.target.result); if(Array.isArray(imported)) accounts=imported; saveToHost(); changeGalaxy('accounts'); showToast('Импорт выполнен'); }catch(e){showToast('Ошибка JSON');} }; reader.readAsText(file); }; inp.click(); }
    function saveSteamPathLocal() { const path = document.getElementById('steamPath')?.value; if(path && window.chrome?.webview) window.chrome.webview.postMessage(JSON.stringify({ action: "setSteamPath", data: path })); showToast('Путь сохранён'); }
    function copyText(text) { navigator.clipboard.writeText(text); showToast('Скопировано'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function showToast(msg) { const t = document.createElement('div'); t.className = 'toast-cosmic'; t.innerHTML = `<i class="fas fa-satellite"></i> ${msg}`; document.body.appendChild(t); setTimeout(()=>t.remove(), 2500); }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    
    window.receiveFromCSharp = function(msg) {
        if(msg.type === "accounts") { accounts = msg.data || []; if(currentGalaxy === 'accounts') renderOrbitAccounts(); if(currentGalaxy === 'stats') renderStatsGalaxy(); document.getElementById('totalCountSpan').innerHTML = accounts.length + ' юнитов'; }
        else if(msg.type === "steamPath") { const inp = document.getElementById('steamPath'); if(inp) inp.value = msg.data || ''; }
        else if(msg.type === "asfStarted") showToast(msg.data);
    };
    
    window.onload = () => {
        createStars();
        if(window.chrome?.webview) window.chrome.webview.postMessage(JSON.stringify({ action: "getAccounts" }));
        else { const saved = localStorage.getItem('orbit_accounts'); if(saved) try { accounts = JSON.parse(saved); } catch(e) {} }
        changeGalaxy('accounts');
    };
</script>
</body>
</html>
