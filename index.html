<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ASF Manager PRO v3.3 | Premium Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');
        
        * { font-family: 'Inter', system-ui, sans-serif; }
        
        body {
            background: radial-gradient(ellipse at 20% 30%, #0a0a0f, #030305);
            min-height: 100vh;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(0, 180, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideInLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(0, 180, 255, 0.3); }
            50% { box-shadow: 0 0 20px rgba(0, 180, 255, 0.5); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        
        .sidebar {
            background: rgba(8, 8, 12, 0.75);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(0, 180, 255, 0.15);
            position: relative;
            z-index: 10;
        }
        
        .sidebar::after {
            content: '';
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(0, 180, 255, 0.5), transparent);
        }
        
        .sidebar-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 14px;
            color: #9ca3af;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }
        
        .sidebar-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 180, 255, 0.1), transparent);
            transition: left 0.5s;
        }
        
        .sidebar-btn:hover::before { left: 100%; }
        
        .sidebar-btn:hover {
            background: linear-gradient(135deg, rgba(0, 180, 255, 0.15), rgba(0, 255, 136, 0.05));
            color: white;
            transform: translateX(4px);
        }
        
        .sidebar-btn.active {
            background: linear-gradient(135deg, rgba(0, 180, 255, 0.25), rgba(0, 136, 204, 0.15));
            color: #00b4ff;
            border-left: 3px solid #00b4ff;
            box-shadow: 0 0 15px rgba(0, 180, 255, 0.2);
        }
        
        .account-card {
            background: linear-gradient(135deg, rgba(22, 25, 35, 0.95) 0%, rgba(16, 18, 25, 0.98) 100%);
            border-radius: 24px;
            border: 1px solid rgba(0, 180, 255, 0.15);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s ease-out;
            backdrop-filter: blur(10px);
        }
        
        .account-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00b4ff, #00ff88, #00b4ff);
            transform: scaleX(0);
            transition: transform 0.6s ease;
        }
        
        .account-card:hover::before { transform: scaleX(1); }
        
        .account-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 180, 255, 0.4);
            box-shadow: 0 20px 40px -15px rgba(0, 180, 255, 0.3);
        }
        
        .card-avatar {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }
        
        .account-card:hover .card-avatar {
            transform: scale(1.08) rotate(5deg);
            border-radius: 14px;
        }
        
        .status-badge {
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        
        .status-online {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #0a0a0f;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            animation: glowPulse 2s infinite;
        }
        
        .status-offline {
            background: rgba(55, 65, 81, 0.6);
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 16px;
        }
        
        .info-item {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            border: 1px solid rgba(0, 180, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .info-item:hover {
            background: rgba(0, 180, 255, 0.08);
            border-color: rgba(0, 180, 255, 0.2);
        }
        
        .info-item i {
            width: 20px;
            font-size: 13px;
            color: #00b4ff;
            transition: transform 0.3s;
        }
        
        .info-item:hover i { transform: scale(1.1); }
        
        .info-label {
            font-size: 11px;
            color: #9ca3af;
            font-weight: 500;
        }
        
        .info-value {
            font-size: 12px;
            color: #f0f0f0;
            font-weight: 700;
            margin-left: auto;
        }
        
        .balance-value {
            background: linear-gradient(135deg, #00ff88, #00b4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }
        
        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        
        .card-btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            border: none;
            position: relative;
            overflow: hidden;
        }
        
        .card-btn-asf {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #0a0a0f;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }
        
        .card-btn-asf:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.5);
        }
        
        .card-btn-inventory {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: white;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }
        
        .card-btn-inventory:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.5);
        }
        
        .card-btn-steam {
            background: linear-gradient(135deg, #1b2838, #0f1a24);
            color: #66c0f4;
            border: 1px solid rgba(102, 192, 244, 0.3);
        }
        
        .card-btn-steam:hover {
            background: linear-gradient(135deg, #2c4c6e, #1b2838);
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(102, 192, 244, 0.3);
        }
        
        .card-btn-edit {
            background: rgba(0, 180, 255, 0.15);
            color: #00b4ff;
            border: 1px solid rgba(0, 180, 255, 0.3);
            flex: none;
            width: 44px;
        }
        
        .card-btn-edit:hover {
            background: rgba(0, 180, 255, 0.3);
            transform: translateY(-3px);
        }
        
        .card-btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            flex: none;
            width: 44px;
        }
        
        .card-btn-delete:hover {
            background: rgba(239, 68, 68, 0.35);
            transform: translateY(-3px);
        }
        
        .card-btn-spoof {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            flex: none;
            width: 44px;
        }
        
        .card-btn-spoof:hover {
            transform: translateY(-3px) rotate(15deg);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }
        
        .card-checkbox {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #00b4ff;
            filter: drop-shadow(0 0 5px rgba(0, 180, 255, 0.5));
            transition: transform 0.2s;
        }
        
        .card-checkbox:hover { transform: scale(1.1); }
        
        input, textarea, select {
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(0, 180, 255, 0.2);
            border-radius: 16px;
            padding: 12px 16px;
            color: white !important;
            transition: all 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #00b4ff;
            box-shadow: 0 0 0 3px rgba(0, 180, 255, 0.15);
            background: rgba(31, 41, 55, 0.95);
        }
        
        .action-btn {
            background: linear-gradient(135deg, rgba(31, 41, 55, 0.9), rgba(31, 41, 55, 0.7));
            border: 1px solid rgba(0, 180, 255, 0.2);
            border-radius: 16px;
            padding: 12px 24px;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .action-btn:hover {
            background: linear-gradient(135deg, #00b4ff, #0088cc);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 180, 255, 0.3);
        }
        
        .danger-btn {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        
        .danger-btn:hover {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00b4ff, #0088cc);
            transition: all 0.3s;
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 180, 255, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #0a0a0f;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.4);
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, rgba(0, 180, 255, 0.95), rgba(0, 136, 204, 0.95));
            backdrop-filter: blur(20px);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            z-index: 1000;
            animation: slideInLeft 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 180, 255, 0.4);
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #00b4ff, #00ff88); border-radius: 10px; }
        
        .modal-content {
            background: rgba(18, 20, 26, 0.98);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(0, 180, 255, 0.3);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.4s ease-out;
        }
        
        .detail-row {
            display: flex;
            padding: 14px;
            border-bottom: 1px solid rgba(0, 180, 255, 0.1);
            align-items: flex-start;
            transition: all 0.3s;
        }
        
        .detail-row:hover {
            background: rgba(0, 180, 255, 0.08);
            border-radius: 16px;
            transform: translateX(5px);
        }
        
        .detail-label {
            width: 150px;
            font-weight: 600;
            color: #9ca3af;
        }
        
        .detail-value {
            flex: 1;
            color: white;
            word-break: break-word;
        }
        
        .copy-btn {
            cursor: pointer;
            padding: 4px 12px;
            background: rgba(0, 180, 255, 0.15);
            border-radius: 10px;
            font-size: 11px;
            margin-left: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #00b4ff;
            transition: all 0.2s;
        }
        
        .copy-btn:hover {
            background: rgba(0, 180, 255, 0.35);
            color: white;
            transform: scale(1.05);
        }
        
        .inventory-item {
            transition: all 0.3s;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(0, 180, 255, 0.1);
        }
        
        .inventory-item:hover {
            transform: translateY(-8px) scale(1.05);
            background: linear-gradient(135deg, rgba(0, 180, 255, 0.15), rgba(0, 180, 255, 0.05));
            border-color: rgba(0, 180, 255, 0.4);
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(22, 25, 35, 0.95), rgba(16, 18, 25, 0.98));
            border: 1px solid rgba(0, 180, 255, 0.15);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.4s;
        }
        
        .stat-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 180, 255, 0.4);
            box-shadow: 0 20px 35px -15px rgba(0, 180, 255, 0.25);
        }
        
        .empty-state {
            background: rgba(31, 41, 55, 0.4);
            border-radius: 28px;
            padding: 60px;
            text-align: center;
            border: 1px dashed rgba(0, 180, 255, 0.3);
        }
        
        .text-gradient {
            background: linear-gradient(135deg, #00b4ff, #00ff88);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .floating { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body>
<div class="flex h-screen">
    <div class="sidebar w-80 p-6 flex flex-col">
        <div class="flex items-center gap-3 mb-10 floating">
            <div class="w-14 h-14 bg-gradient-to-br from-[#00b4ff] to-[#00ff88] rounded-2xl flex items-center justify-center text-3xl shadow-xl">🎮</div>
            <div>
                <h1 class="text-2xl font-black text-gradient">ASF PRO</h1>
                <p class="text-xs text-gray-400 tracking-wider">Manager v3.3 • PREMIUM</p>
            </div>
        </div>
        
        <button onclick="addNewAccount()" class="btn-primary w-full py-3.5 rounded-2xl font-bold flex items-center justify-center gap-2 transition mb-3 shadow-xl">
            <i class="fas fa-plus-circle text-lg"></i> Добавить аккаунт
        </button>
        
        <button onclick="runASFForAll()" class="btn-success w-full py-3.5 rounded-2xl font-bold flex items-center justify-center gap-2 transition mb-8 shadow-xl">
            <i class="fas fa-play-circle text-lg"></i> Запустить всех
        </button>
        
        <div class="space-y-1.5">
            <button onclick="switchTab('accounts')" id="tabAccounts" class="sidebar-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition">
                <i class="fas fa-users w-5 text-lg"></i> Аккаунты
            </button>
            <button onclick="switchTab('inventory')" id="tabInventory" class="sidebar-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition">
                <i class="fas fa-box w-5 text-lg"></i> Инвентарь
            </button>
            <button onclick="switchTab('stats')" id="tabStats" class="sidebar-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition">
                <i class="fas fa-chart-line w-5 text-lg"></i> Статистика
            </button>
            <button onclick="switchTab('settings')" id="tabSettings" class="sidebar-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition">
                <i class="fas fa-cog w-5 text-lg"></i> Настройки
            </button>
        </div>
        
        <div class="mt-auto pt-6 text-xs text-gray-500 border-t border-[#00b4ff]/20">
            <div class="flex items-center justify-between mb-2">
                <span><i class="fas fa-database"></i> Локальное хранение</span>
                <i class="fas fa-shield-alt text-[#00b4ff]"></i>
            </div>
            <span id="accountCount" class="font-bold text-[#00b4ff] text-sm">0 аккаунтов</span>
        </div>
    </div>
    
    <div class="flex-1 p-6 overflow-auto" id="mainContent"></div>
</div>

<div id="detailModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="modal-content w-[900px] max-h-[85vh] overflow-auto p-6">
        <div class="flex justify-between items-center mb-5 pb-3 border-b border-[#00b4ff]/20">
            <h2 id="detailTitle" class="text-2xl font-bold text-gradient"></h2>
            <button onclick="closeDetailModal()" class="text-gray-400 hover:text-white hover:rotate-90 transition-all duration-300 text-3xl">&times;</button>
        </div>
        <div id="detailContent" class="mb-5"></div>
        <div class="flex gap-3 pt-3">
            <button onclick="editFromDetail()" class="flex-1 py-3 bg-[#00b4ff] text-black font-bold rounded-xl transition hover:scale-105">Редактировать</button>
            <button onclick="runASFFromDetail()" class="flex-1 py-3 bg-green-600 text-white font-bold rounded-xl transition hover:scale-105">Запустить ASF</button>
            <button onclick="runSteamFromDetail()" class="flex-1 py-3 bg-[#1b2838] text-white font-bold rounded-xl transition hover:scale-105"><i class="fab fa-steam"></i> Запустить Steam</button>
            <button onclick="deleteFromDetail()" class="flex-1 py-3 bg-red-600 text-white font-bold rounded-xl transition hover:scale-105">Удалить</button>
            <button onclick="closeDetailModal()" class="flex-1 py-3 bg-gray-700 text-white font-bold rounded-xl transition hover:scale-105">Закрыть</button>
        </div>
    </div>
</div>

<div id="editModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="modal-content w-[800px] max-h-[85vh] overflow-auto p-6">
        <h2 id="editTitle" class="text-2xl font-bold mb-5 text-gradient">Редактирование</h2>
        <div class="grid grid-cols-2 gap-4">
            <div><label class="text-gray-400 text-sm font-semibold">Логин Steam *</label><input id="editLogin" class="w-full" placeholder="Введите логин"></div>
            <div><label class="text-gray-400 text-sm font-semibold">Пароль Steam</label><input id="editPassword" type="password" class="w-full" placeholder="Введите пароль"></div>
            <div><label class="text-gray-400 text-sm font-semibold">Steam ID</label><input id="editSteamId" class="w-full" placeholder="7656119..."></div>
            <div><label class="text-gray-400 text-sm font-semibold">Баланс</label><input id="editBalance" class="w-full" placeholder="0 ₽"></div>
            <div><label class="text-gray-400 text-sm font-semibold">Почта</label><input id="editEmail" class="w-full" placeholder="email@example.com"></div>
            <div><label class="text-gray-400 text-sm font-semibold">Пароль почты</label><input id="editEmailPass" type="password" class="w-full" placeholder="Пароль от почты"></div>
            <div><label class="text-gray-400 text-sm font-semibold">Прокси (ip:port)</label><input id="editProxy" class="w-full" placeholder="127.0.0.1:8080"></div>
            <div><label class="text-gray-400 text-sm font-semibold">PIN-код</label><input id="editPin" class="w-full" placeholder="PIN-код"></div>
            <div class="col-span-2"><label class="text-gray-400 text-sm font-semibold">MaFile (JSON)</label><textarea id="editMaFile" rows="3" class="w-full font-mono text-xs" placeholder='{"shared_secret":"..."}'></textarea></div>
            <div class="col-span-2"><label class="text-gray-400 text-sm font-semibold">Заметки</label><textarea id="editNotes" rows="2" class="w-full" placeholder="Дополнительная информация..."></textarea></div>
        </div>
        <div class="flex gap-3 mt-6">
            <button onclick="saveEditedAccount()" class="flex-1 py-3 bg-gradient-to-r from-[#00b4ff] to-[#0088cc] text-white font-bold rounded-xl transition hover:scale-105">Сохранить</button>
            <button onclick="closeEditModal()" class="flex-1 py-3 bg-gray-700 text-white font-bold rounded-xl transition hover:scale-105">Отмена</button>
        </div>
    </div>
</div>

<div id="massEditModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="modal-content w-[500px] p-6">
        <h2 class="text-2xl font-bold mb-5 text-gradient">Массовое редактирование</h2>
        <div class="mb-4">
            <label class="text-gray-400 text-sm font-semibold">Поле для изменения:</label>
            <select id="massEditField" class="w-full mt-2">
                <option value="Proxy">🌐 Прокси</option>
                <option value="Notes">📝 Заметки</option>
                <option value="Status">🟢 Статус</option>
            </select>
        </div>
        <div class="mb-6">
            <label class="text-gray-400 text-sm font-semibold">Новое значение:</label>
            <input type="text" id="massEditValue" class="w-full mt-2" placeholder="Введите значение...">
        </div>
        <div class="flex gap-3">

            <button onclick="closeMassEditModal()" class="flex-1 py-3 bg-gray-700 text-white font-bold rounded-xl transition hover:scale-105">Отмена</button>
        </div>

</div>

<div id="spoofModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="modal-content w-[500px] p-6">

            <button onclick="closeSpoofModal()" class="flex-1 py-3 bg-gray-700 text-white font-bold rounded-xl transition hover:scale-105">Отмена</button>
        </div>

</div>

<script>
let accounts = [];
let currentTab = 'accounts';
let currentDetailAccount = null;
let currentEditId = null;
let currentFilter = '';
let currentSort = 'date-desc';
let showPasswords = {};
let selectedAccountsForMass = new Set();
let searchTimeout = null;
let currentSpoofAccountId = null;

const games = [
    { name: "Counter-Strike 2", appId: "730" },
    { name: "Dota 2", appId: "570" },
    { name: "Team Fortress 2", appId: "440" },
    { name: "Rust", appId: "252490" },
    { name: "Grand Theft Auto V", appId: "271590" },
    { name: "PUBG: BATTLEGROUNDS", appId: "578080" },
    { name: "Apex Legends", appId: "1172470" },
    { name: "Destiny 2", appId: "1085660" },
    { name: "Warframe", appId: "230410" },
    { name: "Path of Exile", appId: "238960" }
];

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.sidebar-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('active');
    if (tab === 'accounts') renderAccounts();
    else if (tab === 'inventory') renderInventory();
    else if (tab === 'stats') renderStats();
    else if (tab === 'settings') renderSettings();
}

function getFilteredAndSortedAccounts() {
    let filtered = [...accounts];
    if (currentFilter && currentFilter.trim()) {
        const searchLower = currentFilter.toLowerCase();
        filtered = filtered.filter(acc =>
            acc.Login.toLowerCase().includes(searchLower) ||
            (acc.Email && acc.Email.toLowerCase().includes(searchLower)) ||
            (acc.SteamId && acc.SteamId.includes(searchLower)) ||
            (acc.Notes && acc.Notes.toLowerCase().includes(searchLower)) ||
            (acc.Proxy && acc.Proxy.toLowerCase().includes(searchLower))
        );
    }
    switch(currentSort) {
        case 'date-desc': filtered.sort((a,b) => new Date(b.CreatedAt) - new Date(a.CreatedAt)); break;
        case 'date-asc': filtered.sort((a,b) => new Date(a.CreatedAt) - new Date(b.CreatedAt)); break;
        case 'login-asc': filtered.sort((a,b) => a.Login.localeCompare(b.Login)); break;
        case 'login-desc': filtered.sort((a,b) => b.Login.localeCompare(a.Login)); break;
        case 'status': filtered.sort((a,b) => (a.Status === 'Online' ? 0 : 1) - (b.Status === 'Online' ? 0 : 1)); break;
        case 'balance': filtered.sort((a,b) => { let balA = parseFloat(a.Balance.replace(/[^0-9.-]/g, '')) || 0; let balB = parseFloat(b.Balance.replace(/[^0-9.-]/g, '')) || 0; return balB - balA; }); break;
    }
    return filtered;
}

function renderAccounts() {
    const filtered = getFilteredAndSortedAccounts();
    
    let html = `
        <div class="mb-6">
            <div class="flex gap-3 flex-wrap">
                <div class="flex-1 min-w-[250px] relative">
                    <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                    <input type="text" id="searchInput" placeholder="Поиск по логину, email, Steam ID, заметкам, прокси..." class="w-full pl-11 py-3 rounded-2xl bg-gray-800/80 border border-[#00b4ff]/20 text-white" onkeyup="updateSearch()">
                </div>
                <select id="sortSelect" onchange="updateSort()" class="rounded-2xl bg-gray-800/80 border border-[#00b4ff]/20 text-white px-4 py-3">
                    <option value="date-desc">📅 Сначала новые</option>
                    <option value="date-asc">📅 Сначала старые</option>
                    <option value="login-asc">🔤 Логин (А-Я)</option>
                    <option value="login-desc">🔤 Логин (Я-А)</option>
                    <option value="status">🟢 По статусу</option>
                    <option value="balance">💰 По балансу</option>
                </select>
                <button onclick="showMassEditModal()" class="action-btn px-6 py-3 rounded-2xl">
                    <i class="fas fa-check-double"></i> Выбрано (<span id="selectedCount">0</span>)
                </button>
                <button onclick="deleteAllAccounts()" class="action-btn danger-btn px-6 py-3 rounded-2xl">
                    <i class="fas fa-trash-alt"></i> Удалить все
                </button>
            </div>
            <div class="flex justify-between mt-4 text-sm text-gray-500 px-2">
                <span><i class="fas fa-filter"></i> Найдено: <span class="text-white font-semibold">${filtered.length}</span> из <span class="text-white font-semibold">${accounts.length}</span></span>
                ${currentFilter ? `<span>🔍 "${currentFilter}" <button onclick="clearSearch()" class="text-[#00b4ff] hover:underline ml-2">✖ Очистить</button></span>` : ''}
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
    `;
    
    filtered.forEach(acc => {
        let lastLoginText = acc.LastLogin ? new Date(acc.LastLogin).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) : 'никогда';
        let avatarColor = `hsl(${Math.abs(acc.Login.split('').reduce((a,b)=>a+b.charCodeAt(0),0) % 360)}, 70%, 55%)`;
        let isSelected = selectedAccountsForMass.has(acc.Id);
        
        let displayLogin = acc.Login;
        if (currentFilter) {
            const regex = new RegExp(`(${currentFilter})`, 'gi');
            displayLogin = acc.Login.replace(regex, '<mark class="bg-[#00b4ff]/40 text-white px-1 rounded">$1</mark>');
        }
        
        html += `
        <div class="account-card p-5" data-id="${acc.Id}" onclick="showAccountDetail('${acc.Id}')">
            <input type="checkbox" class="card-checkbox" onclick="event.stopPropagation(); toggleMassSelect('${acc.Id}')" ${isSelected ? 'checked' : ''}>
            
            <div class="flex justify-between items-start ml-7">
                <div class="flex items-center gap-4">
                    <div class="card-avatar" style="background: linear-gradient(135deg, ${avatarColor}, ${avatarColor}aa); box-shadow: 0 8px 20px ${avatarColor}40;">
                        ${acc.Login[0]?.toUpperCase() || '?'}
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-white">${displayLogin}</h3>
                        <p class="text-gray-500 text-xs mt-1">${acc.Email || 'без почты'}</p>
                    </div>
                </div>
                <div class="status-badge ${acc.Status === 'Online' ? 'status-online' : 'status-offline'}">
                    <i class="fas fa-circle ${acc.Status === 'Online' ? 'text-black' : 'text-gray-500'} text-[6px]"></i>
                    ${acc.Status === 'Online' ? 'Онлайн' : 'Оффлайн'}
                </div>
            </div>
            
            <div class="info-grid">
                <div class="info-item">
                    <i class="fas fa-network-wired"></i>
                    <span class="info-label">Прокси</span>
                    <span class="info-value">${acc.Proxy ? '✅ Да' : '❌ Нет'}</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-file-code"></i>
                    <span class="info-label">MaFile</span>
                    <span class="info-value">${acc.MaFile ? '✅ Да' : '❌ Нет'}</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-coins"></i>
                    <span class="info-label">Баланс</span>
                    <span class="info-value balance-value">${acc.Balance}</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-calendar"></i>
                    <span class="info-label">Последний вход</span>
                    <span class="info-value">${lastLoginText}</span>
                </div>
            </div>
            
            <div class="card-actions" onclick="event.stopPropagation()">
                <button onclick="runASF('${acc.Login}')" class="card-btn card-btn-asf">
                    <i class="fas fa-play"></i> ASF
                </button>
                <button onclick="viewInventory('${acc.SteamId || acc.Login}')" class="card-btn card-btn-inventory">
                    <i class="fas fa-box"></i> Инвентарь
                </button>
                <button onclick="runSteam('${acc.Login}', '${escapeHtml(acc.Password)}')" class="card-btn card-btn-steam">
                    <i class="fab fa-steam"></i> Steam
                </button>
                <button onclick="editAccount('${acc.Id}')" class="card-btn card-btn-edit">
                    <i class="fas fa-pen"></i>
                </button>
                <button onclick="openSpooferSettings('${acc.Id}')" class="card-btn card-btn-spoof" title="Настройки спуфера">
                    <i class="fas fa-magic"></i>
                </button>
                <button onclick="deleteAccount('${acc.Id}')" class="card-btn card-btn-delete">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>`;
    });
    
    html += filtered.length === 0 ? `
        <div class="col-span-full">
            <div class="empty-state">
                <i class="fas fa-inbox text-6xl text-gray-600 mb-5 block"></i>
                <p class="text-gray-400 text-xl mb-4">Нет аккаунтов</p>
                <button onclick="addNewAccount()" class="px-8 py-3 bg-gradient-to-r from-[#00b4ff] to-[#0088cc] rounded-xl font-bold transition hover:scale-105 text-white shadow-lg">➕ Добавить первый аккаунт</button>
            </div>
        </div>` : '';
    html += `</div>`;
    
    document.getElementById('mainContent').innerHTML = html;
    document.getElementById('accountCount').innerHTML = `${accounts.length} аккаунтов`;
    document.getElementById('selectedCount').innerText = selectedAccountsForMass.size;
}

function updateSearchDebounced() {
    if (searchTimeout) clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        currentFilter = document.getElementById('searchInput')?.value || '';
        renderAccounts();
    }, 300);
}

function updateSearch() { updateSearchDebounced(); }
function updateSort() { currentSort = document.getElementById('sortSelect')?.value || 'date-desc'; renderAccounts(); }
function clearSearch() { currentFilter = ''; const input = document.getElementById('searchInput'); if (input) input.value = ''; renderAccounts(); }

function renderStats() {
    const onlineCount = accounts.filter(a => a.Status === 'Online').length;
    const totalBalance = accounts.reduce((sum, acc) => {
        const n = parseFloat(acc.Balance.replace(/[^0-9.-]/g, ''));
        return sum + (isNaN(n) ? 0 : n);
    }, 0);
    const withProxy = accounts.filter(a => a.Proxy).length;
    const withMaFile = accounts.filter(a => a.MaFile).length;
    const avgBalance = accounts.length ? (totalBalance / accounts.length).toFixed(2) : 0;
    
    document.getElementById('mainContent').innerHTML = `
        <div class="max-w-7xl mx-auto">
            <h2 class="text-4xl font-bold mb-8 text-gradient">Статистика аккаунтов</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="stat-card"><div class="text-gray-400 text-sm mb-2"><i class="fas fa-users text-[#00b4ff] text-lg"></i> Всего аккаунтов</div><div class="text-5xl font-bold text-white">${accounts.length}</div></div>
                <div class="stat-card"><div class="text-gray-400 text-sm mb-2"><i class="fas fa-circle text-green-400"></i> Онлайн</div><div class="text-5xl font-bold text-green-400">${onlineCount}</div><div class="text-xs text-gray-500 mt-2">${accounts.length ? Math.round(onlineCount/accounts.length*100) : 0}% от всех</div></div>
                <div class="stat-card"><div class="text-gray-400 text-sm mb-2"><i class="fas fa-coins text-[#00b4ff]"></i> Общий баланс</div><div class="text-5xl font-bold text-emerald-400">${totalBalance.toFixed(2)} ₽</div></div>
                <div class="stat-card"><div class="text-gray-400 text-sm mb-2"><i class="fas fa-chart-line text-[#00b4ff]"></i> Средний баланс</div><div class="text-5xl font-bold text-cyan-400">${avgBalance} ₽</div></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="stat-card"><h3 class="text-xl font-bold mb-5 text-white"><i class="fas fa-shield-alt text-[#00b4ff] mr-2"></i> Защита аккаунтов</h3><div class="space-y-3"><div class="flex justify-between items-center p-3 rounded-xl bg-black/40"><span class="text-gray-300"><i class="fas fa-network-wired text-[#00b4ff] mr-2"></i> С прокси:</span><span class="font-bold text-white text-lg">${withProxy} (${Math.round(withProxy/accounts.length*100)||0}%)</span></div><div class="flex justify-between items-center p-3 rounded-xl bg-black/40"><span class="text-gray-300"><i class="fas fa-file-code text-[#00b4ff] mr-2"></i> С MaFile:</span><span class="font-bold text-white text-lg">${withMaFile} (${Math.round(withMaFile/accounts.length*100)||0}%)</span></div></div></div>
                <div class="stat-card"><h3 class="text-xl font-bold mb-5 text-white"><i class="fas fa-history text-[#00b4ff] mr-2"></i> Активность</h3><div class="space-y-2 max-h-52 overflow-auto">${accounts.filter(a => a.LastLogin).slice(0,5).map(a => `<div class="text-sm py-2 px-3 rounded-lg bg-black/30 text-gray-300">${a.Login}: ${new Date(a.LastLogin).toLocaleDateString('ru-RU')}</div>`).join('') || '<div class="text-gray-500">Нет данных</div>'}</div></div>
            </div>
        </div>
    `;
}

function renderInventory() {
    let gameOptions = games.map(g => `<option value="${g.appId}">${g.name}</option>`).join('');
    document.getElementById('mainContent').innerHTML = `
        <div class="max-w-6xl mx-auto">
            <div class="stat-card p-6 mb-6">
                <h2 class="text-3xl font-bold mb-6 text-gradient"><i class="fas fa-box text-purple-400 mr-2"></i> Инвентарь Steam</h2>
                <div class="flex gap-4 flex-wrap">
                    <div class="flex-1 min-w-[200px]">
                        <label class="text-gray-400 text-sm mb-2 block font-semibold">Steam ID или логин</label>
                        <input type="text" id="inventorySteamId" placeholder="7656119..." class="w-full rounded-2xl">
                    </div>
                    <div class="min-w-[180px]">
                        <label class="text-gray-400 text-sm mb-2 block font-semibold">Выберите игру</label>
                        <select id="inventoryAppId" class="w-full rounded-2xl">${gameOptions}</select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="loadInventory()" class="btn-primary px-8 py-3 rounded-2xl font-bold shadow-xl"><i class="fas fa-search"></i> Загрузить</button>
                    </div>
                </div>
                <div class="mt-5 p-4 bg-[#00b4ff]/10 rounded-xl text-xs text-gray-300 border border-[#00b4ff]/20">
                    <i class="fas fa-info-circle text-[#00b4ff] mr-2"></i>Поддерживаемые игры: CS2, Dota 2, TF2, Rust, GTA V, PUBG, Apex Legends и другие
                </div>
            </div>
            <div id="inventoryResult" class="stat-card p-6">
                <div class="text-center text-gray-500 py-20">
                    <i class="fas fa-steam text-6xl mb-5 block text-[#00b4ff] opacity-50"></i>
                    <p class="text-lg">Введите Steam ID для просмотра инвентаря</p>
                </div>
            </div>
        </div>
    `;
}

function loadInventory() {
    let steamId = document.getElementById('inventorySteamId').value;
    let appId = document.getElementById('inventoryAppId').value;
    if (!steamId) { showToast('Введите Steam ID'); return; }
    document.getElementById('inventoryResult').innerHTML = '<div class="text-center py-20"><i class="fas fa-spinner fa-spin text-5xl text-[#00b4ff] mb-4 block"></i><p class="text-gray-400">Загрузка инвентаря...</p></div>';
    window.chrome.webview.postMessage(JSON.stringify({ action: "getInventory", data: `${steamId}|${appId}` }));
}

function viewInventory(steamId) {
    if (!steamId || steamId === '—') { showToast('Укажите Steam ID в настройках аккаунта'); return; }
    switchTab('inventory');
    setTimeout(() => { const input = document.getElementById('inventorySteamId'); if (input) input.value = steamId; loadInventory(); }, 100);
}

function renderSettings() {
    document.getElementById('mainContent').innerHTML = `
        <div class="max-w-3xl mx-auto space-y-6">
            <div class="stat-card p-8">
                <h2 class="text-3xl font-bold mb-6 text-gradient"><i class="fas fa-database mr-2"></i> Управление данными</h2>
                <div class="space-y-4">
                    <button onclick="exportData()" class="btn-success w-full py-4 rounded-2xl font-bold shadow-xl transition hover:scale-105"><i class="fas fa-download"></i> Экспорт всех аккаунтов (JSON)</button>
                    <button onclick="importData()" class="btn-primary w-full py-4 rounded-2xl font-bold shadow-xl transition hover:scale-105"><i class="fas fa-upload"></i> Импорт аккаунтов</button>
                </div>
            </div>
            <div class="stat-card p-8">
                <h2 class="text-3xl font-bold mb-6 text-gradient"><i class="fab fa-steam mr-2"></i> Настройки Steam</h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-gray-400 text-sm font-semibold">Путь к Steam.exe</label>
                        <div class="flex gap-3 mt-2">
                            <input type="text" id="steamPathInput" class="flex-1 rounded-2xl" placeholder="C:\\Program Files (x86)\\Steam\\Steam.exe">
                            <button onclick="browseSteamPath()" class="px-6 py-3 bg-gray-700 rounded-2xl font-semibold hover:bg-gray-600 transition">Обзор</button>
                            <button onclick="saveSteamPath()" class="px-6 py-3 bg-[#00b4ff] rounded-2xl font-semibold hover:scale-105 transition">Сохранить</button>
                        </div>
                        <p class="text-xs text-gray-500 mt-2"><i class="fas fa-info-circle"></i> Укажите путь для автоматического входа в Steam</p>
                    </div>
                </div>
            </div>
            <div class="stat-card p-8">
                <h2 class="text-3xl font-bold mb-6 text-gradient"><i class="fas fa-info-circle mr-2"></i> О программе</h2>
                <p class="text-2xl font-bold text-[#00b4ff] mb-4">ASF Manager PRO v3.3</p>
                <div class="grid grid-cols-2 gap-3 mt-4 text-sm text-gray-300">
                    <div class="flex items-center gap-2 p-2 rounded-lg bg-black/30"><i class="fas fa-check-circle text-green-500"></i> Управление аккаунтами Steam</div>
                    <div class="flex items-center gap-2 p-2 rounded-lg bg-black/30"><i class="fas fa-check-circle text-green-500"></i> Запуск ASF</div>
                    <div class="flex items-center gap-2 p-2 rounded-lg bg-black/30"><i class="fas fa-check-circle text-green-500"></i> Автоматический вход в Steam</div>
                    <div class="flex items-center gap-2 p-2 rounded-lg bg-black/30"><i class="fas fa-check-circle text-green-500"></i> Спуфер и изоляция аккаунтов</div>
                    <div class="flex items-center gap-2 p-2 rounded-lg bg-black/30"><i class="fas fa-check-circle text-green-500"></i> Просмотр инвентаря из 10+ игр</div>
                    <div class="flex items-center gap-2 p-2 rounded-lg bg-black/30"><i class="fas fa-check-circle text-green-500"></i> Статистика и мониторинг</div>
                    <div class="flex items-center gap-2 p-2 rounded-lg bg-black/30"><i class="fas fa-check-circle text-green-500"></i> Поиск, фильтрация, сортировка</div>
                    <div class="flex items-center gap-2 p-2 rounded-lg bg-black/30"><i class="fas fa-check-circle text-green-500"></i> Массовые операции</div>
                </div>
                <div class="mt-6 p-4 bg-black/40 rounded-xl border border-[#00b4ff]/20">
                    <p class="text-xs text-gray-400"><i class="fas fa-folder-open"></i> Данные хранятся в папке:</p>
                    <p class="text-xs font-mono text-gray-300 break-all mt-1">ASF_Data\\accounts.json (рядом с EXE)</p>
                </div>
            </div>
        </div>
    `;
    loadSteamPath();
}

function loadSteamPath() {
    window.chrome.webview.postMessage(JSON.stringify({ action: "getSteamPath", data: "" }));
}

function browseSteamPath() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.exe';
    input.onchange = e => {
        if (e.target.files[0]) {
            document.getElementById('steamPathInput').value = e.target.files[0].path;
        }
    };
    input.click();
}

function saveSteamPath() {
    const path = document.getElementById('steamPathInput').value;
    if (path) {
        window.chrome.webview.postMessage(JSON.stringify({ action: "setSteamPath", data: path }));
    }
}

function showAccountDetail(id) {
    const acc = accounts.find(a => a.Id === id);
    if (!acc) return;
    currentDetailAccount = acc;
    let isPassShowing = showPasswords[acc.Id];
    
    let html = `
        <div class="detail-row"><div class="detail-label"><i class="fas fa-sign-in-alt w-4 text-[#00b4ff] mr-2"></i> Логин:</div><div class="detail-value">${escapeHtml(acc.Login)} <span class="copy-btn" onclick="copyToClipboard('${escapeHtml(acc.Login)}')"><i class="fas fa-copy"></i> Копировать</span></div></div>
        <div class="detail-row"><div class="detail-label"><i class="fas fa-lock w-4 text-[#00b4ff] mr-2"></i> Пароль:</div><div class="detail-value">${isPassShowing ? escapeHtml(acc.Password) : '••••••••'} <span class="copy-btn" onclick="copyToClipboard('${escapeHtml(acc.Password)}')"><i class="fas fa-copy"></i> Копировать</span> <span class="copy-btn" onclick="togglePassword('${acc.Id}')"><i class="fas ${isPassShowing ? 'fa-eye-slash' : 'fa-eye'}"></i> ${isPassShowing ? 'Скрыть' : 'Показать'}</span></div></div>
        <div class="detail-row"><div class="detail-label"><i class="fas fa-envelope w-4 text-[#00b4ff] mr-2"></i> Почта:</div><div class="detail-value">${escapeHtml(acc.Email) || '—'}</div></div>
        <div class="detail-row"><div class="detail-label"><i class="fas fa-key w-4 text-[#00b4ff] mr-2"></i> Пароль почты:</div><div class="detail-value">${isPassShowing ? escapeHtml(acc.EmailPass) : '••••••••'}</div></div>
        <div class="detail-row"><div class="detail-label"><i class="fas fa-network-wired w-4 text-[#00b4ff] mr-2"></i> Прокси:</div><div class="detail-value">${escapeHtml(acc.Proxy) || '—'}</div></div>
        <div class="detail-row"><div class="detail-label"><i class="fas fa-digit w-4 text-[#00b4ff] mr-2"></i> PIN-код:</div><div class="detail-value">${escapeHtml(acc.Pin) || '—'}</div></div>
        <div class="detail-row"><div class="detail-label"><i class="fab fa-steam w-4 text-[#00b4ff] mr-2"></i> Steam ID:</div><div class="detail-value">${escapeHtml(acc.SteamId) || '—'}</div></div>
        <div class="detail-row"><div class="detail-label"><i class="fas fa-coins w-4 text-[#00b4ff] mr-2"></i> Баланс:</div><div class="detail-value"><span class="text-emerald-400 font-bold text-xl">${acc.Balance}</span></div></div>
        <div class="detail-row"><div class="detail-label"><i class="fas fa-microchip w-4 text-[#00b4ff] mr-2"></i> HWID:</div><div class="detail-value">${acc.HardwareId || 'Не задан'} <span class="copy-btn" onclick="copyToClipboard('${acc.HardwareId || ''}')"><i class="fas fa-copy"></i> Копировать</span></div></div>
        <div class="detail-row"><div class="detail-label"><i class="fas fa-shield-alt w-4 text-[#00b4ff] mr-2"></i> Изоляция:</div><div class="detail-value">${acc.UseIsolation ? '✅ Включена' : '❌ Выключена'}</div></div>
        <div class="detail-row"><div class="detail-label"><i class="fas fa-tv w-4 text-[#00b4ff] mr-2"></i> Режим запуска:</div><div class="detail-value">${acc.LaunchMode === 'bigpicture' ? 'Big Picture' : acc.LaunchMode === 'vr' ? 'VR режим' : 'Обычный'}</div></div>
        <div class="detail-row"><div class="detail-label"><i class="fas fa-calendar-plus w-4 text-[#00b4ff] mr-2"></i> Дата создания:</div><div class="detail-value">${new Date(acc.CreatedAt).toLocaleString('ru-RU')}</div></div>
        <div class="detail-row"><div class="detail-label"><i class="fas fa-calendar-check w-4 text-[#00b4ff] mr-2"></i> Последний вход:</div><div class="detail-value">${acc.LastLogin ? new Date(acc.LastLogin).toLocaleString('ru-RU') : '—'}</div></div>
    `;
    
    if (acc.MaFile) {
        html += `<div class="detail-row"><div class="detail-label"><i class="fas fa-file-code w-4 text-[#00b4ff] mr-2"></i> MaFile:</div><div class="detail-value"><pre class="bg-black/50 p-3 rounded-xl text-xs overflow-auto max-h-32 text-white border border-[#00b4ff]/20">${escapeHtml(acc.MaFile.substring(0, 500))}${acc.MaFile.length > 500 ? '...' : ''}</pre><span class="copy-btn inline-block mt-2" onclick="copyToClipboard('${escapeHtml(acc.MaFile)}')"><i class="fas fa-copy"></i> Копировать весь MaFile</span></div></div>`;
    }
    
    if (acc.Notes) {
        html += `<div class="detail-row"><div class="detail-label"><i class="fas fa-sticky-note w-4 text-[#00b4ff] mr-2"></i> Заметки:</div><div class="detail-value whitespace-pre-wrap text-white">${escapeHtml(acc.Notes)}</div></div>`;
    }
    
    document.getElementById('detailTitle').innerHTML = `<i class="fas fa-user-circle text-[#00b4ff] mr-2"></i> ${escapeHtml(acc.Login)}`;
    document.getElementById('detailContent').innerHTML = html;
    document.getElementById('detailModal').classList.remove('hidden');
}

function togglePassword(id) { showPasswords[id] = !showPasswords[id]; showAccountDetail(id); }
function deleteFromDetail() { if (currentDetailAccount && confirm(`Удалить аккаунт "${currentDetailAccount.Login}" навсегда?`)) { deleteAccount(currentDetailAccount.Id); closeDetailModal(); } }
function editFromDetail() { if (currentDetailAccount) { closeDetailModal(); editAccount(currentDetailAccount.Id); } }
function runASFFromDetail() { if (currentDetailAccount) { runASF(currentDetailAccount.Login); showToast(`Запуск ASF для ${currentDetailAccount.Login}`); } }
function runSteamFromDetail() { if (currentDetailAccount) { runSteam(currentDetailAccount.Login, currentDetailAccount.Password); } }

function deleteAllAccounts() {
    if (confirm("⚠️ ВНИМАНИЕ! Вы уверены, что хотите удалить ВСЕ аккаунты?")) {
        window.chrome.webview.postMessage(JSON.stringify({ action: "deleteAllAccounts", data: "" }));
        accounts = [];
        renderAccounts();
        showToast('Все аккаунты удалены');
    }
}

function runASFForAll() {
    if (!accounts.length) { showToast('Нет аккаунтов для запуска'); return; }
    if (confirm(`Запустить ASF для всех ${accounts.length} аккаунтов?`)) {
        window.chrome.webview.postMessage(JSON.stringify({ action: "runASFForAll", data: "" }));
    }
}

function exportData() {
    const blob = new Blob([JSON.stringify(accounts, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `asf_backup_${new Date().toISOString().slice(0,19)}.json`;
    a.click();
    URL.revokeObjectURL(blob);
    showToast('Экспорт выполнен');
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const imported = JSON.parse(ev.target.result);
                if (Array.isArray(imported)) {
                    accounts = imported;
                    window.chrome.webview.postMessage(JSON.stringify({ action: "saveAccounts", data: JSON.stringify(accounts) }));
                    renderAccounts();
                    showToast(`Импортировано ${accounts.length} аккаунтов`);
                }
            } catch { showToast('Ошибка импорта'); }
        };
        reader.readAsText(file);
    };
    input.click();
}

function addNewAccount() {
    currentEditId = null;
    document.getElementById('editTitle').innerHTML = 'Новый аккаунт';
    clearEditForm();
    document.getElementById('editModal').classList.remove('hidden');
}

function editAccount(id) {
    const acc = accounts.find(a => a.Id === id);
    if (!acc) return;
    currentEditId = id;
    document.getElementById('editTitle').innerHTML = `Редактирование: ${acc.Login}`;
    document.getElementById('editLogin').value = acc.Login || '';
    document.getElementById('editPassword').value = acc.Password || '';
    document.getElementById('editSteamId').value = acc.SteamId || '';
    document.getElementById('editBalance').value = acc.Balance || '0 ₽';
    document.getElementById('editEmail').value = acc.Email || '';
    document.getElementById('editEmailPass').value = acc.EmailPass || '';
    document.getElementById('editProxy').value = acc.Proxy || '';
    document.getElementById('editPin').value = acc.Pin || '';
    document.getElementById('editMaFile').value = acc.MaFile || '';
    document.getElementById('editNotes').value = acc.Notes || '';
    document.getElementById('editModal').classList.remove('hidden');
}

function clearEditForm() {
    document.getElementById('editLogin').value = `acc_${Date.now().toString().slice(-6)}`;
    document.getElementById('editPassword').value = '';
    document.getElementById('editSteamId').value = '';
    document.getElementById('editBalance').value = '0 ₽';
    document.getElementById('editEmail').value = '';
    document.getElementById('editEmailPass').value = '';
    document.getElementById('editProxy').value = '';
    document.getElementById('editPin').value = '';
    document.getElementById('editMaFile').value = '';
    document.getElementById('editNotes').value = '';
}

function saveEditedAccount() {
    const data = {
        Id: currentEditId || Date.now().toString(),
        Login: document.getElementById('editLogin').value.trim(),
        Password: document.getElementById('editPassword').value,
        SteamId: document.getElementById('editSteamId').value,
        Email: document.getElementById('editEmail').value,
        EmailPass: document.getElementById('editEmailPass').value,
        Proxy: document.getElementById('editProxy').value,
        Pin: document.getElementById('editPin').value,
        MaFile: document.getElementById('editMaFile').value,
        Notes: document.getElementById('editNotes').value,
        Status: currentEditId ? (accounts.find(a => a.Id === currentEditId)?.Status || "Offline") : "Offline",
        Balance: document.getElementById('editBalance').value || "0 ₽",
        CreatedAt: currentEditId ? (accounts.find(a => a.Id === currentEditId)?.CreatedAt || new Date().toISOString()) : new Date().toISOString(),
        LastLogin: "",
        LastSteamLaunch: "",
        CardsRemaining: 0,
        GamesCount: 0,
        SteamConfigPath: "",
        HardwareId: currentEditId ? (accounts.find(a => a.Id === currentEditId)?.HardwareId || "") : "",
        UseIsolation: currentEditId ? (accounts.find(a => a.Id === currentEditId)?.UseIsolation || false) : false,
        LaunchMode: currentEditId ? (accounts.find(a => a.Id === currentEditId)?.LaunchMode || "normal") : "normal",
        LastIP: "",
        LastCountry: "",
        SteamLevel: "0",
        TotalGames: 0,
        HoursPlayed: 0,
        TwoFactorEnabled: false,
        TradeLink: "",
        AvatarUrl: "",
        Tags: [],
        CustomFields: {}
    };
    
    if (!data.Login) { showToast('Логин обязателен для заполнения'); return; }
    
    if (currentEditId) {
        const index = accounts.findIndex(a => a.Id === currentEditId);
        if (index > -1) accounts[index] = data;
    } else {
        accounts.unshift(data);
    }
    
    window.chrome.webview.postMessage(JSON.stringify({ action: "saveAccounts", data: JSON.stringify(accounts) }));
    closeEditModal();
    renderAccounts();
    showToast('Аккаунт сохранён');
}

function deleteAccount(id) {
    if (confirm('Удалить аккаунт навсегда?')) {
        window.chrome.webview.postMessage(JSON.stringify({ action: "deleteAccount", data: id }));
        accounts = accounts.filter(a => a.Id !== id);
        selectedAccountsForMass.delete(id);
        renderAccounts();
        showToast('Аккаунт удалён');
    }
}

function runASF(login) { window.chrome.webview.postMessage(JSON.stringify({ action: "runASF", data: login })); }

function runSteam(login, password) {
    if (!login || !password) { showToast('Укажите логин и пароль для входа в Steam'); return; }
    const account = accounts.find(a => a.Login === login);
    if (account && account.HardwareId) { showToast(`Запуск Steam для ${login} с HWID: ${account.HardwareId.substring(0, 10)}...`); }
    else { showToast(`Запуск Steam для ${login}`); }
    window.chrome.webview.postMessage(JSON.stringify({ action: "runSteam", data: `${login}|${password}` }));
}

function copyToClipboard(text) {
    if (!text || text === '—') { showToast('Нет данных для копирования'); return; }
    window.chrome.webview.postMessage(JSON.stringify({ action: "copyToClipboard", data: text }));
    showToast('Скопировано в буфер обмена!');
}

function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<i class="fas fa-check-circle mr-2"></i> ${message}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); currentDetailAccount = null; }
function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); currentEditId = null; }
function closeMassEditModal() { document.getElementById('massEditModal').classList.add('hidden'); document.getElementById('massEditValue').value = ''; }
function closeSpoofModal() { document.getElementById('spoofModal').classList.add('hidden'); currentSpoofAccountId = null; }

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

function toggleMassSelect(accountId) {
    if (selectedAccountsForMass.has(accountId)) selectedAccountsForMass.delete(accountId);
    else selectedAccountsForMass.add(accountId);
    updateMassSelectUI();
    renderAccounts();
}

function updateMassSelectUI() { document.getElementById('selectedCount').innerText = selectedAccountsForMass.size; }

function showMassEditModal() {
    if (selectedAccountsForMass.size === 0) { showToast('Сначала выберите аккаунты (чекбоксы на карточках)'); return; }
    document.getElementById('massEditModal').classList.remove('hidden');
}

function applyMassEdit() {
    const field = document.getElementById('massEditField').value;
    const value = document.getElementById('massEditValue').value;
    if (!value) { showToast('Введите значение для изменения'); return; }
    const accountIds = Array.from(selectedAccountsForMass);
    const updateData = { AccountIds: accountIds, Fields: { [field]: value } };
    window.chrome.webview.postMessage(JSON.stringify({ action: "massUpdate", data: JSON.stringify(updateData) }));
    closeMassEditModal();
    selectedAccountsForMass.clear();
    updateMassSelectUI();
    showToast(`Обновлено ${accountIds.length} аккаунтов`);
}

function openSpooferSettings(accountId) {
    const account = accounts.find(a => a.Id === accountId);
    if (!account) return;
    currentSpoofAccountId = accountId;
    document.getElementById('spoofAccountName').innerText = account.Login;
    document.getElementById('hwidInput').value = account.HardwareId || '';
    document.getElementById('isolationCheckbox').checked = account.UseIsolation || false;
    document.getElementById('launchModeSelect').value = account.LaunchMode || 'normal';
    document.getElementById('spoofModal').classList.remove('hidden');
}

function generateHWID() {
    const newHwid = 'HWID-' + Math.random().toString(36).substring(2, 15).toUpperCase() + '-' + Date.now().toString().slice(-6);
    document.getElementById('hwidInput').value = newHwid;
    showToast('Сгенерирован новый HWID');
}

function saveSpooferSettings() {
    if (!currentSpoofAccountId) return;
    const account = accounts.find(a => a.Id === currentSpoofAccountId);
    if (account) {
        account.HardwareId = document.getElementById('hwidInput').value;
        account.UseIsolation = document.getElementById('isolationCheckbox').checked;
        account.LaunchMode = document.getElementById('launchModeSelect').value;
        window.chrome.webview.postMessage(JSON.stringify({ action: "saveAccounts", data: JSON.stringify(accounts) }));
        closeSpoofModal();
        renderAccounts();
        showToast('Настройки спуфера сохранены');
    }
}

function renderInventoryResult(data) {
    if (!data?.data?.success || !data.data.assets?.length) {
        document.getElementById('inventoryResult').innerHTML = '<div class="text-center py-20 text-gray-500"><i class="fas fa-box-open text-6xl mb-4 block"></i>Нет предметов или профиль приватный</div>';
        return;
    }
    const gameName = games.find(g => g.appId === data.appId)?.name || `Игра ${data.appId}`;
    let html = `<h3 class="text-2xl font-bold mb-6 text-white"><i class="fab fa-steam text-[#00b4ff] mr-2"></i> ${gameName}</h3><div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-5">`;
    data.data.assets.forEach(item => {
        const desc = data.data.descriptions?.find(d => d.classid === item.classid);
        if (desc) {
            html += `<div class="inventory-item"><img src="https://steamcommunity.com/economy/image/${desc.icon_url}" class="w-24 h-24 mx-auto mb-3 rounded-xl"><p class="text-xs font-bold text-white truncate">${escapeHtml(desc.name.substring(0, 30))}</p><p class="text-xs text-emerald-400 font-bold mt-2">x${item.amount}</p></div>`;
        }
    });
    html += `</div>`;
    document.getElementById('inventoryResult').innerHTML = html;
}

window.receiveFromCSharp = function(msg) {
    if (msg.type === "accounts") {
        accounts = msg.data || [];
        if (currentTab === 'accounts') renderAccounts();
        if (currentTab === 'stats') renderStats();
        document.getElementById('accountCount').innerHTML = `${accounts.length} аккаунтов`;
    } else if (msg.type === "inventoryData") {
        renderInventoryResult(msg.data);
    } else if (msg.type === "inventoryError") {
        document.getElementById('inventoryResult').innerHTML = `<div class="text-center py-20 text-red-400"><i class="fas fa-exclamation-triangle text-6xl mb-4 block"></i>${msg.data}</div>`;
    } else if (msg.type === "asfStarted") {
        showToast(msg.data);
        if (currentTab === 'accounts') renderAccounts();
        if (currentTab === 'stats') renderStats();
    } else if (msg.type === "asfError") {
        showToast(msg.data);
    } else if (msg.type === "steamStarted") {
        showToast(msg.data);
        if (currentTab === 'accounts') renderAccounts();
    } else if (msg.type === "steamError") {
        showToast(msg.data);
    } else if (msg.type === "steamPath") {
        if (document.getElementById('steamPathInput')) {
            document.getElementById('steamPathInput').value = msg.data || '';
        }
    } else if (msg.type === "steamPathSaved") {
        showToast('Путь к Steam сохранен');
    } else if (msg.type === "hotkey") {
        if (msg.data === 'new') addNewAccount();
        else if (msg.data === 'search') document.getElementById('searchInput')?.focus();
    } else if (msg.type === "massUpdateComplete") {
        showToast(`Обновлено ${msg.data.count} аккаунтов`);
        renderAccounts();
    } else if (msg.type === "hwidGenerated") {
        if (document.getElementById('hwidInput')) {
            document.getElementById('hwidInput').value = msg.data;
        }
    }
};

window.onload = () => {
    window.chrome.webview.postMessage(JSON.stringify({ action: "getAccounts" }));
    switchTab('accounts');
};
</script>
</body>
</html>
